[project]
name = "asisten-ai"
version = "0.1.0"
description = "Asisten AI Operasional GYNTRANS - LangGraph Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "langchain-anthropic>=1.6.0",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-cli[inmem]>=0.4.31",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.3",
    "temporalio>=1.31.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: butuh koneksi Meilisearch dan data produksi",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
