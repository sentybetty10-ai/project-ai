# Korpus regresi tools_rates.
#
# Menambah kasus tidak perlu menulis kode. Salin chat asli dari WhatsApp,
# isi slot seperti yang seharusnya diisi LLM, lalu tulis hasil yang benar.
#
#   id     penanda bebas, dipakai sebagai nama tes
#   chat   kalimat asli user, untuk dokumentasi
#   slots  argumen tools_rates: origin, destinasi, customer, expedisi, type_mobil
#   harap  yang wajib benar: status, needs, row_id, type_mobil
#
# Jalankan dengan: uv run pytest -q -m live

cases:
