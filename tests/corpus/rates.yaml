    chat: "rate Makmur Technology muat Semarang tujuan Tanggerang-Bogor-Bekasi"
    slots:
      customer: "Makmur Technology"
      origin: "Semarang"
      destinasi: "Tanggerang-Bogor-Bekasi"
    harap:
      status: success
      row_id: 6403

